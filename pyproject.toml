[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The repository name contains a hyphen, so Ruff derives an invalid module
# name for package initializers even though the package layout is intentional.
"__init__.py" = ["N999"]

[tool.ty.environment]
extra-paths = ["typings"]
python-version = "3.11"
