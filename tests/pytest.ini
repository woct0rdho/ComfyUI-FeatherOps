[pytest]
# ComfyUI loads this directory as a package, so `__init__.py` lives at the repository root and its
# relative imports only work when it is imported as part of a package. pytest builds a collector for
# every directory above the test root, and the repository name contains a hyphen, so pytest cannot
# import that root package: it falls back to importing `__init__.py` as a bare module and the relative
# imports fail. Anchoring the rootdir here cuts the chain, which is why this file cannot move to the
# repository root (no root-level option - consider_namespace_packages, import mode, rootdir - avoids
# the collector, only the rootdir choice does).
testpaths = .
